name: Build NNOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-iso:
    name: Build NNOS x86_64 ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show runner
        run: |
          uname -a
          df -h
          free -h
          nproc

      - name: Prepare build environment
        run: sudo bash ./build/scripts/prepare.sh

      - name: Build ISO
        run: sudo bash ./build/scripts/build.sh

      - name: Verify ISO
        run: |
          test -s out/NNOS-0.1.0-x86_64.iso
          sha256sum -c out/NNOS-0.1.0-x86_64.iso.sha256

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v6
        with:
          name: NNOS-0.1.0-x86_64
          path: out/
          if-no-files-found: error
          retention-days: 14
